name: Release

# Push a tag like v0.7.1 to build the plugin and publish the install zip as a GitHub Release.
# Run manually (workflow_dispatch) to get the zip as a build artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin
        run: dotnet build src/SpicyWeeks/SpicyWeeks.csproj -c Release

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="dev-${GITHUB_SHA::7}"
          echo "zip=$(scripts/package.sh "$version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SpicyWeeks
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --title "Spicy Weeks $GITHUB_REF_NAME" --notes-file packaging/INSTALL.txt
