## Settings file was created by plugin Spicy Weeks v0.9.0
## Plugin GUID: olden-era-mods.spicy-weeks

[Astrology]

## Comma-separated week/month effects that never happen; a banned roll becomes Week/Month of Calm. astrologist_month_5 = Month of Clarity (reveals the whole map), astrologist_week_5 = Week of Dusk, astrologist_week_6 = 3-day week. Sids are in DB/weeks_info.json inside Core.zip.
# Setting type: String
# Default value: astrologist_month_5
BannedEffects = astrologist_month_5

[Debug]

## Clear the fog around each spawned stack (for testing).
# Setting type: Boolean
# Default value: false
RevealSpawns = false

[Invasions]

## Neutral invasion weeks on maps without their own script (all random maps).
# Setting type: Boolean
# Default value: true
Enabled = true

## Invasion size: one stack per this many map tiles (160x160 -> 64 stacks, 72x72 -> 12).
# Setting type: Int32
# Default value: 400
TilesPerStack = 400

## Strength of each stack in week 2; the game scales the stack size to this.
# Setting type: Int32
# Default value: 4000
StackValue = 4000

## Compound growth of stack strength per week (12 -> ~10k by week 10, ~30k by week 20).
# Setting type: Int32
# Default value: 12
WeeklyGrowthPercent = 12

## Chance (0-100) that an eligible week is an invasion week.
# Setting type: Int32
# Default value: 25
ChancePercent = 25

## Earliest game week an invasion can happen (week 2 starts on day 8).
# Setting type: Int32
# Default value: 3
FirstWeek = 3

## Quiet weeks required between two invasions.
# Setting type: Int32
# Default value: 2
MinWeeksBetween = 2

## Moods an invasion can roll, comma-separated; list one twice to make it more likely. They set how likely stacks are to offer to join a hero, from Aggressive (Raging: least likely) through Negative (Restless), Common (the themed week) and Friendly (Wandering) to Peaceful (Travelling: most likely).
# Setting type: String
# Default value: Aggressive,Negative,Common,Friendly,Peaceful
Moods = Aggressive,Negative,Common,Friendly,Peaceful

## On invasion weeks, replace the astrologer's week effect and announcement with the invasion.
# Setting type: Boolean
# Default value: true
OverrideWeekEffect = true

